# Copy to group_vars/all.yml (git-ignored) and adjust. NO SECRETS here — secrets live in the
# secret store / Coolify and are injected at runtime (@rules/workflow-secrets.md). Use
# ansible-vault for anything sensitive that must be in Ansible.

# --- Identity / access (non-custodial — ADR 0008) ---
# A shared, Ansible-managed role account owns automation/ops, so nothing is tied to one person.
# FIRST run: connect as an existing sudo user (ansible_user=b007ab1e in inventory.ini) to create it;
# AFTERWARDS you can set ansible_user=deploy. Set manage_deploy_account: false to instead just use
# an existing personal account (then deploy_user should name that account).
deploy_user: deploy
manage_deploy_account: true

# Authorized keys for the deploy account — the SINGLE SOURCE OF TRUTH. One line per MAINTAINER
# (humans who run full ops); each independently revocable (remove it and re-run = offboarded).
# CI/automation does NOT go here — it uses the scoped `automation` account below.
deploy_authorized_keys:
  - "ssh-ed25519 AAAA__MAINTAINER_1__ critter"
  - "ssh-ed25519 AAAA__MAINTAINER_2__ b007ab1e"

# --- Automation identity (scoped least-privilege — ADR 0009) for CI / scheduled ops ---
# A SEPARATE account from `deploy`: NOT in sudo/docker groups; may run as root ONLY the explicit
# commands in automation_sudo_commands (NOPASSWD). Use this key for CI and cron-driven ops.
manage_automation_account: true
automation_user: automation
automation_authorized_keys:
  - "ssh-ed25519 AAAA__CI_AUTOMATION_KEY__ ci@fablab"
# Exact absolute command paths the automation account may run as root — nothing else. Empty = no
# sudo at all. Keep this list minimal; expand deliberately as scheduled-ops needs appear.
automation_sudo_commands:
  - "/usr/local/sbin/fablab-backup-mongo"   # trigger an on-demand encrypted backup

# Restrict SSH logins to these users. LEAVE EMPTY to avoid lockout (SSH stays key-only, no root,
# no password regardless). If you later lock down, include EVERY maintainer + deploy + automation,
# e.g. [deploy, automation, critter, b007ab1e]. (The Coolify root-SSH Match block re-grants 'root'
# within its Docker-scoped block, so 'root' need not be in this global list.)
ssh_allow_users: []

# Coolify's control plane SSHes to this host as root from its Docker networks — enable the scoped,
# key-only root exception (global PermitRootLogin stays 'no'). See roles/harden/defaults/main.yml.
harden_coolify_allow_root_ssh_from_docker: true

# --- Domains (ADR 0002) ---
primary_domain: "fablabfortsmith.org"
coolify_fqdn: "deploy.fablabfortsmith.org"     # Coolify dashboard host
preview_wildcard: "*.preview.fablabfortsmith.org"

# --- Firewall: lock web ports to Cloudflare only (zero-trust origin — std-zero-trust) ---
# Ranges are AUTO-FETCHED from cloudflare.com/ips at converge time; the lists below are only a
# FALLBACK used if that fetch fails. No manual paste needed in the normal case.
restrict_web_to_cloudflare: true
cloudflare_ipv4_ranges:
  - "173.245.48.0/20"
  - "103.21.244.0/22"
  - "104.16.0.0/13"
  - "104.24.0.0/14"
  - "172.64.0.0/13"
  - "131.0.72.0/22"
  # ... add the full current list before applying.
cloudflare_ipv6_ranges:
  - "2400:cb00::/32"
  - "2606:4700::/32"
  # ... add the full current list.

# --- SSH certificate authority (agent access — ADR 0011) ---
# Trust a CA so short-lived, CA-signed certs grant access instead of long-lived authorized_keys.
# The PRIVATE CA key stays offline / in the secret store (or use Vault's SSH engine as the broker,
# see ../ssh-ca/README.md); only the PUBLIC key goes here. Leave disabled until you set the key.
ssh_ca_enabled: false
ssh_ca_public_key: ""   # e.g. "ssh-ed25519 AAAA... fablab-ssh-ca"
ssh_ca_principals:
  automation: ["automation"]     # ops-role certs -> the scoped automation account (ADR 0009)
  deploy: ["deploy", "maintainer"]
ssh_ca_krl_content: ""  # optional Key Revocation List; empty = rely on short TTLs

# --- Tailscale (tailnet-only admin/dev access — @rules/topic-tailnet-dev-access.md) ---
# Join the VPS to your tailnet so the Coolify dashboard (and other admin/dev services) are reachable
# over the private WireGuard mesh instead of the public internet. Set TAILSCALE_AUTHKEY in ../.env
# (a key from the Tailscale admin console) and enable below. tailscale_allowed_ports lists the host
# ports the tailnet may reach (8000 = Coolify UI; add 80/443 to serve the app/domain over the tailnet).
tailscale_enabled: false
tailscale_hostname: "fablab-prod"
tailscale_allowed_ports: [8000]

# --- ZeroTier (mesh overlay; coexists with Tailscale) ---
# Join the VPS to a ZeroTier network — e.g. to reach the shared Vaultwarden secret store over the
# overlay. The 16-hex network ID is NOT a secret (a node must still be AUTHORIZED on the controller
# at my.zerotier.com after joining), so it lives here, not in ../.env. Default = no inbound exposure
# (join is for outbound reach); to expose host ports to ZT peers set zerotier_allowed_ports +
# zerotier_src_ranges (the ZT-managed subnet). After first converge, authorize the node in ZT Central.
zerotier_enabled: false
zerotier_network_id: ""              # e.g. "8056c2e21c000001" (16 hex chars)
zerotier_allowed_ports: []
zerotier_src_ranges: []

# --- Coolify ---
coolify_install: true

# --- MongoDB (ADR 0010: standalone self-hosted on a private docker network) ---
# Root + app passwords are AUTO-GENERATED into ../.env (`make secrets`) and read at converge time
# — NOT here (@rules/workflow-secrets.md). These are non-secret knobs only.
mongodb_manage: true
mongodb_image: "mongo:7.0"              # pin to a digest before prod (@rules/std-supplychain.md)
mongodb_app_db: "thelab"
mongodb_app_user: "thelab_app"
mongodb_network: "fablab"              # attach the Coolify app to this docker network

# --- Backups (ADR 0007/0010: MongoDB on the VPS = our responsibility) ---
backups_enabled: true
backups_local_dir: "/var/backups/fablab"
backups_schedule_hour: 3                 # daily mongodump at 03:00 UTC (monotonic-safe cron)
backups_local_retention_days: 7          # local copies pruned after N days
# At-rest encryption (age) + off-box (restic) are OPT-IN via SECRETS in ../.env — never here
# (BACKUP_AGE_RECIPIENT, RESTIC_REPOSITORY/PASSWORD, BACKUP_S3_ACCESS_KEY_ID/SECRET_ACCESS_KEY).
# Unset = local-only + a loud warning. Enabling steps: docs/runbooks/backup-restore.md.
# Off-box restic retention (override if needed):
backups_restic_keep_daily: 7
backups_restic_keep_weekly: 4
backups_restic_keep_monthly: 6
