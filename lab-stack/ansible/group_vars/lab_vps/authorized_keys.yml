# VERSION-CONTROLLED so it does not drift per operator machine (the trap that let a converge
# from one maintainer's `all.yml` silently drop another maintainer's key).
#
# PUBLIC KEYS ONLY. This file is intentionally tracked (the rest of group_vars/ is git-ignored
# because it carries host IPs/secrets). SSH public keys are not secret; NEVER put host addresses,
