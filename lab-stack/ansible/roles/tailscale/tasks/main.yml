---
# Join the host to the owner's Tailscale tailnet so admin/dev services (e.g. the Coolify
# dashboard) are reachable over the private WireGuard mesh — NOT the public internet
# (@rules/topic-tailnet-dev-access.md, @rules/std-zero-trust.md). The auth key is injected at
# runtime from TAILSCALE_AUTHKEY (../.env) and is never logged or committed.

- name: Assert a Tailscale auth key is present
  ansible.builtin.assert:
    that: tailscale_authkey | length > 0
    fail_msg: >-
      TAILSCALE_AUTHKEY must be set (a key from the Tailscale admin console). Add it to ../.env
      and run via `make converge`.
    quiet: true

- name: Install prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg]
    state: present
    update_cache: true

- name: Create keyring dir
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

# Signing key VENDORED + pinned (roles/tailscale/files/tailscale-archive-keyring.gpg) — NOT fetched
# at runtime. Fetching an apt-authorizing key TOFU over HTTPS is a supply-chain gap (CWE-494 /
# @rules/std-supplychain.md). One key across all codenames.
# Fingerprint: 2596 A99E AAB3 3821 893C 0A79 458C A832 957F 5868 (Tailscale Inc. signing key).
- name: Install the pinned Tailscale signing key
  ansible.builtin.copy:
    src: tailscale-archive-keyring.gpg
    dest: /etc/apt/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Read the installed Tailscale key fingerprint
  ansible.builtin.command: gpg --show-keys --with-colons /etc/apt/keyrings/tailscale-archive-keyring.gpg
  register: tailscale_key
  changed_when: false
  # Read-only, so run it in check mode too. Otherwise --check skips it, the assert below sees an
  # empty stdout and fails as if the signing key had been tampered with (#93).
  check_mode: false

- name: Assert the Tailscale key matches the published signing key (fail closed on tamper)
  ansible.builtin.assert:
    that: "'2596A99EAAB33821893C0A79458CA832957F5868' in tailscale_key.stdout"
    fail_msg: >-
      Tailscale signing key fingerprint mismatch — refusing to add the repo (possible tamper).
      Expected 2596A99EAAB33821893C0A79458CA832957F5868.
    quiet: true

- name: Add Tailscale APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/tailscale-archive-keyring.gpg]
      https://pkgs.tailscale.com/stable/ubuntu
      {{ ansible_distribution_release }} main
    filename: tailscale
    state: present

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Ensure tailscaled is running and enabled
  ansible.builtin.service:
    name: tailscaled
    state: started
    enabled: true

- name: Check current Tailscale backend state
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  # Read-only probe: also run under --check, otherwise its output is empty in check mode and
  # whatever consumes it (assert / when / from_json) fails misleadingly (#93).
  check_mode: false
  failed_when: false

- name: Bring Tailscale up (join the tailnet)
  ansible.builtin.command: >-
    tailscale up
    --authkey={{ tailscale_authkey }}
    --hostname={{ tailscale_hostname }}
    --accept-dns={{ tailscale_accept_dns | lower }}
  register: tailscale_up
  changed_when: true
  no_log: true   # the command line carries the auth key — never log it
  when: >-
    tailscale_status.rc != 0
    or (tailscale_status.stdout | default('{}') | from_json).BackendState | default('') != 'Running'

- name: Allow the tailnet to reach the configured ports (UFW)
  community.general.ufw:
    rule: allow
    src: "{{ item.0 }}"
    port: "{{ item.1 | string }}"
    proto: tcp
  loop: "{{ tailscale_src_ranges | product(tailscale_allowed_ports) | list }}"

- name: Get the Tailscale IPv4 (for the summary)
  ansible.builtin.command: tailscale ip -4
  register: tailscale_ip
  changed_when: false
  # Read-only probe: also run under --check, otherwise its output is empty in check mode and
  # whatever consumes it (assert / when / from_json) fails misleadingly (#93).
  check_mode: false
  failed_when: false

- name: How to reach services over the tailnet
  ansible.builtin.debug:
    msg: >-
      Tailscale up as '{{ tailscale_hostname }}' ({{ tailscale_ip.stdout | default('?') | trim }}).
      Reach the Coolify dashboard over the tailnet at http://{{ tailscale_hostname }}:8000
      (MagicDNS) or the 100.x IP above, port 8000.
