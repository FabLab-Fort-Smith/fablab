---
# Self-hosted S3-compatible object storage (SeaweedFS) on the VPS — replaces the external
# s3.crittercodes.dev instance (issue #96; partially reverses the "S3 external" half of ADR 0007).
#
# WHY SEAWEEDFS AND NOT MINIO: MinIO's community edition is END OF LIFE — the admin console was
# stripped in early 2025, the repo went to maintenance mode in Dec 2025 and was ARCHIVED read-only
# on 2026-04-25. An archived upstream means no security patches, which fails
# @rules/workflow-vuln-mgmt.md. SeaweedFS is Apache-2.0 (no AGPL obligation either) and actively
# maintained. Garage was evaluated and rejected: it implements no bucket policies (so no anonymous
# object read, which the app requires) and no object versioning.
#
# Secret keys come from ../.env at converge time (generated by `make secrets`), NOT from here —
# never put secrets in group_vars (@rules/workflow-secrets.md).
seaweedfs_manage: true

# Pin the image. Pin to a DIGEST before this fronts production (@rules/std-supplychain.md):
#   chrislusf/seaweedfs@sha256:3bbe24f6d5f5818327adcfeda7d85240ed53212dab05f91af14484c6446ec5eb
seaweedfs_image: "chrislusf/seaweedfs:4.41"
# Ephemeral S3 client for the few things the config file can't express (bucket versioning).
# aws-cli is used deliberately instead of MinIO's `mc`, which is part of the same archived project.
seaweedfs_awscli_image: "amazon/aws-cli:latest"

# Provider-NEUTRAL container name and env-file: the app config should not have to change if the
# storage engine is ever swapped again (this is the second engine for the same job).
seaweedfs_container_name: "fablab-s3"
seaweedfs_network: "fablab"             # the private network this stack owns
# Networks it ALSO joins so Coolify-deployed apps resolve it by name. Same reasoning as the mongodb
# role: attaching here (compose config) survives a restart/recreate, whereas a manual
# `docker network connect` does not — that is runtime state and staging lost its DB to it (#92).
seaweedfs_shared_networks:
  - "coolify"

# The container's process runs as the image's `seaweed` user (uid/gid 1000) — NOT root, even though
# `docker exec` lands as root, which is what initially masked this. A 0600 root-only s3.json is
# therefore UNREADABLE to it and the S3 gateway dies fatally (master/filer keep running, so the
# container looks "Up" while port 8333 refuses). We do NOT fix that by chowning to uid 1000: on this
# host uid/gid 1000 is a human account (`critter`), which would hand it the S3 secret keys. Instead
# the config is root-owned, group-readable by a DEDICATED system group, and the container joins that
# group via `group_add` — so in-container it stays non-root, and on the host only root can read it.
seaweedfs_config_group: "fablab-s3"
seaweedfs_config_gid: 3000

seaweedfs_volume: "fablab_s3_data"
seaweedfs_dir: "/opt/fablab/seaweedfs"  # compose project dir on the VPS (root-only)

# NO published host ports: the app reaches S3 over the docker network, exactly like MongoDB. Public
# exposure (s3.fablabfortsmith.org via Cloudflare + Traefik) is a SEPARATE, gated step in #96.
seaweedfs_publish_ports: false
seaweedfs_s3_port: 8333
seaweedfs_master_port: 9333
seaweedfs_volume_port: 8080
seaweedfs_filer_port: 8888
# Cap a single volume file so storage grows in bounded chunks on an 8 GB VPS.
seaweedfs_volume_size_limit_mb: 1024

seaweedfs_bucket: "fablab-bounties"
seaweedfs_region: "us-east-1"

# --- Identities (rendered into s3.json; secret keys injected from ../.env) ---
# Access keys are identifiers, not secrets, so they live here.
seaweedfs_admin_access_key: "fablab-admin"
seaweedfs_app_access_key: "fablab-app"
# The app is scoped to ONE bucket. Verified against a live SeaweedFS 4.41: this key can
# read/write/delete/list inside its own bucket, and is DENIED writing to another bucket, listing
# another bucket, deleting any bucket, and it sees only its own bucket in ListBuckets.
# Deliberately NOT "Admin" — production was previously found running on the storage ROOT
# credential, which could delete nine other projects' buckets.
seaweedfs_app_actions:
  - "Read"
  - "Write"
  - "List"
  - "Tagging"

# Anonymous READ of OBJECTS is required: browsers load image URLs directly (the app builds public
# object URLs and its CSP allows the S3 host). SeaweedFS expresses this as an identity named
# `anonymous` with NO credentials. Granting only `Read` (never `List`) yields exactly:
# anonymous GET 200, LIST 403, PUT 403, DELETE 403, and 403 on any other bucket — all verified.
seaweedfs_anonymous_read: true

# Object versioning: without it a leaked app credential can permanently erase objects; with it a
# delete only writes a delete-marker and the prior version stays recoverable (verified).
seaweedfs_versioning: true

# Where the app-facing S3 settings are written on the box (root-only), mirroring
# mongodb_backup_env, so the backup cron and operators have one place to look.
seaweedfs_env_file: "/etc/fablab/objstore.env"
