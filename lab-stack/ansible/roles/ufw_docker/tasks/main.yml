---
# ufw + Docker coexistence (durable fix).
#
# Problem this solves (observed 2026-07-14): after a ufw reload / reboot, ufw's
# default-deny + generated chains break Docker's networking so that:
#   (a) Docker-published ports can bypass ufw, and
#   (b) containers can no longer reach the HOST — e.g. Coolify's control plane
#       SSHing to the host on :22 via host.docker.internal failed with
#       "connect to host host.docker.internal port 22: Connection refused",
#       leaving the server "not reachable" and deployments failing.
#
# Fix = the canonical `ufw-docker` after.rules block (so ufw manages Docker's
# forwarded/published traffic instead of fighting it) + explicit allows for the
# Docker bridge subnets to reach the host on the ports Coolify needs, + the
# forwarding sysctl. Idempotent and SSH-safe (adds ACCEPTs only; never drops the
# admin's access). See roles/ufw_docker/README.md and ADR 0006/0011.

- name: Ensure IPv4 forwarding is enabled (Docker requires it; ufw can disable it)
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    sysctl_set: true
    reload: true

- name: Set ufw DEFAULT_FORWARD_POLICY to ACCEPT (Docker governs forward via DOCKER-USER)
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_FORWARD_POLICY='
    line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'
  notify: Reload ufw

# The canonical chaifeng/ufw-docker block. Makes ufw own the DOCKER-USER chain:
# container-originated traffic from private ranges is RETURNed (allowed — this is
# what lets Coolify's bridge reach the host and other containers), while inbound
# public access to container ports must be opened explicitly (hardening bonus).
- name: Install the ufw-docker rules block in /etc/ufw/after.rules
  ansible.builtin.blockinfile:
    path: /etc/ufw/after.rules
    marker: "# {mark} ANSIBLE MANAGED BLOCK — ufw-docker (lab-stack)"
    insertafter: EOF
    block: |
      # BEGIN UFW AND DOCKER
      *filter
      :ufw-user-forward - [0:0]
      :ufw-docker-logging-deny - [0:0]
      :DOCKER-USER - [0:0]
      -A DOCKER-USER -j ufw-user-forward

      -A DOCKER-USER -j RETURN -s 10.0.0.0/8
      -A DOCKER-USER -j RETURN -s 172.16.0.0/12
      -A DOCKER-USER -j RETURN -s 192.168.0.0/16

      -A DOCKER-USER -p udp -m udp --sport 53 --dport 1024:65535 -j RETURN

      -A DOCKER-USER -j ufw-docker-logging-deny -p tcp -m tcp --tcp-flags FIN,SYN,RST,ACK SYN -d 192.168.0.0/16
      -A DOCKER-USER -j ufw-docker-logging-deny -p tcp -m tcp --tcp-flags FIN,SYN,RST,ACK SYN -d 10.0.0.0/8
      -A DOCKER-USER -j ufw-docker-logging-deny -p tcp -m tcp --tcp-flags FIN,SYN,RST,ACK SYN -d 172.16.0.0/12
      -A DOCKER-USER -j ufw-docker-logging-deny -p udp -m udp --dport 0:32767 -d 192.168.0.0/16
      -A DOCKER-USER -j ufw-docker-logging-deny -p udp -m udp --dport 0:32767 -d 10.0.0.0/8
      -A DOCKER-USER -j ufw-docker-logging-deny -p udp -m udp --dport 0:32767 -d 172.16.0.0/12

      -A DOCKER-USER -j RETURN

      -A ufw-docker-logging-deny -m limit --limit 3/min --limit-burst 10 -j LOG --log-prefix "[UFW DOCKER BLOCK] "
      -A ufw-docker-logging-deny -j DROP

      COMMIT
      # END UFW AND DOCKER
  notify:
    - Reload ufw
    - Restart docker

# Container->host (INPUT) path: allow the Docker bridge subnets to reach the host
# on exactly the ports containers legitimately need (Coolify -> host :22 for the
# localhost server connection). Accept-only; cannot lock out the admin.
- name: Allow Docker bridge subnets to reach the host on the required ports
  community.general.ufw:
    rule: allow
    src: "{{ item.0 }}"
    port: "{{ item.1 | string }}"
    proto: tcp
    comment: "docker->host (ufw_docker role)"
  loop: "{{ ufw_docker_bridge_cidrs | product(ufw_docker_host_ports) | list }}"
  notify: Reload ufw
