---
# Standalone self-hosted MongoDB (ADR 0010, superseding the Coolify-managed DB in ADR 0007).
# Root + least-privilege app credentials come from ../.env at converge time (generated by
# `make secrets`), NOT from here — never put secrets in group_vars (@rules/workflow-secrets.md).
mongodb_manage: true
mongodb_image: "mongo:8.0"              # matches the running instance (8.0.26); a MAJOR DOWNGRADE
                                        # (8 -> 7) will NOT start on 8.0 data files, so never lower
                                        # this without a dump/restore. Pin to a digest before prod
                                        # (@rules/std-supplychain.md).
mongodb_container_name: "fablab-mongo"
mongodb_network: "fablab"              # the private network this stack owns
# Networks Mongo ALSO joins so Coolify-deployed apps can resolve it by name. Coolify puts every
# application on its own "coolify" network, and containers only reach each other by DNS name when
# they share one. Attaching here (compose config) rather than by hand means it survives a Mongo
# restart or container recreate — a manual `docker network connect` does NOT, because that is runtime
# state: staging silently lost its database when Mongo restarted ("ENOTFOUND fablab-mongo").
mongodb_shared_networks:
  - "coolify"
mongodb_volume: "fablab_mongo_data"
mongodb_dir: "/opt/fablab/mongodb"     # compose project dir on the VPS (root-only)
# LEGACY single-database vars. Still honoured so an existing host converges unchanged, but new
# work should use mongodb_databases below. (#107)
mongodb_app_db: "thelab"
mongodb_app_user: "thelab_app"

# Databases + least-privilege app users reconciled on EVERY converge, one entry per environment.
# Naming schema (#107): <project>_<environment>, lowercase snake_case, environment always last, so a
# second project sharing this mongod can never be mistaken for ours. `authSource` is the database
# itself, matching the existing pattern. Each user gets readWrite on ITS OWN database only — a
# staging credential must never be able to read production.
#   password_env: the ../.env key holding that user's password (generated by `make secrets`).
mongodb_databases:
  - db: "{{ mongodb_app_db }}"          # legacy staging db; retired in phase 2 of #107
    user: "{{ mongodb_app_user }}"
    password_env: "MONGO_APP_PASSWORD"
  - db: "thelab_production"
    user: "thelab_production_app"
    password_env: "MONGO_APP_PASSWORD_PRODUCTION"
  - db: "thelab_staging"
    user: "thelab_staging_app"
    password_env: "MONGO_APP_PASSWORD_STAGING"
mongodb_backup_env: "/etc/fablab/mongo.env"   # root-only; sourced by the backup cron
