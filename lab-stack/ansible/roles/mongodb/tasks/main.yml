---
# Deploy standalone MongoDB as a Docker Compose stack on a PRIVATE docker network (never a
# published host port). Root creds + a least-privilege app user/db are created from the
# generated secrets in ../.env (ADR 0010). Idempotent; safe to re-run (ADR 0004).
#
# STATUS: validated on the real VPS (2026-07-12) — root auth, app-user reconcile, and a
# backup + restore drill all pass. The app user is reconciled every converge (below); the
# first-boot init script is a best-effort fast path, not the source of truth.

- name: Require MongoDB secrets (from ../.env via `make converge`; generate with `make secrets`)
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'MONGO_ROOT_PASSWORD') | length > 0
      - lookup('ansible.builtin.env', 'MONGO_APP_PASSWORD') | length > 0
    fail_msg: >-
      MONGO_ROOT_PASSWORD and MONGO_APP_PASSWORD must be set. Run via `make converge`
      (it sources ../.env); generate them first with `make secrets` / `make setup`.

- name: Capture MongoDB secrets (never logged)
  ansible.builtin.set_fact:
    mongodb_root_pw: "{{ lookup('ansible.builtin.env', 'MONGO_ROOT_PASSWORD') }}"
    # Compat URI only (see defaults): it must match mongodb_app_user, which is now the staging user.
    mongodb_app_pw: "{{ lookup('ansible.builtin.env', 'MONGO_APP_PASSWORD_STAGING') }}"
  no_log: true

- name: Create compose project + init dirs (root-only)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ mongodb_dir }}"
    - "{{ mongodb_dir }}/init"

- name: Render root credentials env-file for compose (0600)
  ansible.builtin.template:
    src: mongo.env.j2
    dest: "{{ mongodb_dir }}/mongo.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Render the app-user init script (first-boot only; 0600)
  ansible.builtin.template:
    src: mongo-init.js.j2
    dest: "{{ mongodb_dir }}/init/10-app-user.js"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Render the compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ mongodb_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0640"

# compose declares the shared networks as `external: true`, so it refuses to start if one does
# not exist yet (e.g. Mongo converges before Coolify is installed). Creating it here is
# idempotent and harmless: a no-op if Coolify already made it, and Coolify adopts an existing
# network if it comes later.
- name: Ensure shared docker networks exist (Coolify's application network)
  ansible.builtin.command:
    cmd: docker network create {{ item }}
  loop: "{{ mongodb_shared_networks | default([]) }}"
  register: mongodb_shared_net
  changed_when: mongodb_shared_net.rc == 0
  failed_when: >-
    mongodb_shared_net.rc != 0
    and ('already exists' not in mongodb_shared_net.stderr)

- name: Start / refresh the MongoDB compose stack
  ansible.builtin.command:
    cmd: docker compose -f {{ mongodb_dir }}/compose.yaml up -d --remove-orphans
  register: mongodb_compose
  changed_when: >-
    ('Started' in mongodb_compose.stderr) or ('Created' in mongodb_compose.stderr)
    or ('Recreated' in mongodb_compose.stderr)

# The init script (10-app-user.js) only runs on a first, empty-volume boot. If that never
# fires (volume already existed, init errored, etc.) the app user is silently absent and the
# app can't authenticate. So reconcile it every converge — authoritative, and it also
# propagates an app-password rotation to the live user (@rules/topic-database.md).
- name: Wait for MongoDB to accept root authentication
  ansible.builtin.command:
    cmd: >-
      docker exec -e RP={{ mongodb_root_pw | quote }} {{ mongodb_container_name }}
      sh -c 'mongosh --quiet -u root -p "$RP" --authenticationDatabase admin
      --eval "db.adminCommand({ping:1}).ok"'
  register: mongodb_ping
  until: mongodb_ping.rc == 0 and (mongodb_ping.stdout | trim) == '1'
  retries: 20
  delay: 3
  changed_when: false
  # Read-only probe: also run under --check, otherwise its output is empty in check mode and
  # whatever consumes it (assert / when / from_json) fails misleadingly (#93).
  check_mode: false
  no_log: true

- name: Require a password for every configured database
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', item.password_env) | length > 0
    fail_msg: >-
      {{ item.password_env }} is empty but database '{{ item.db }}' is configured. Generate it with
      `make secrets` (it is in the local-secrets manifest) and re-run via `make converge`.
    quiet: true
  loop: "{{ mongodb_databases }}"
  loop_control:
    label: "{{ item.db }}"

# One least-privilege user per database, reconciled EVERY converge (authoritative + self-healing,
# and it propagates a password rotation). Reported changed only on creation, so a steady-state run
# stays quiet. Passwords are read from the environment inside the container — never on a command
# line, where `ps` would expose them.
- name: Reconcile the least-privilege app users (create-or-update; idempotent)
  ansible.builtin.command:
    cmd: >-
      docker exec -e RP={{ mongodb_root_pw | quote }} -e AP -e AU={{ item.user | quote }}
      -e ADB={{ item.db | quote }}
      {{ mongodb_container_name }} sh -c 'mongosh --quiet -u root -p "$RP"
      --authenticationDatabase admin --eval "
      var adb=process.env.ADB, au=process.env.AU, ap=process.env.AP;
      var d=db.getSiblingDB(adb);
      if (d.getUsers().users.some(function(u){return u.user===au;})) {
        d.changeUserPassword(au, ap);
        d.updateUser(au, {roles:[{role:\"readWrite\", db:adb}]});
        print(\"reconciled:updated\");
      } else {
        d.createUser({user:au, pwd:ap, roles:[{role:\"readWrite\", db:adb}]});
        print(\"reconciled:created\");
      }"'
  environment:
    AP: "{{ lookup('ansible.builtin.env', item.password_env) }}"
  loop: "{{ mongodb_databases }}"
  loop_control:
    label: "{{ item.db }} / {{ item.user }}"
  register: mongodb_appusers
  changed_when: "'reconciled:created' in mongodb_appusers.stdout"
  no_log: true

- name: Ensure the backup env-file directory exists (root-only)
  ansible.builtin.file:
    path: "{{ mongodb_backup_env | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write the backup env-file (MONGODB_URI for the backup cron; 0600)
  ansible.builtin.template:
    src: backup-env.j2
    dest: "{{ mongodb_backup_env }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Remind — wire the app to MongoDB (no secrets printed)
  ansible.builtin.debug:
    msg:
      - "MongoDB '{{ mongodb_container_name }}' is up on private net '{{ mongodb_network }}' (no host port)."
      - "Also joined: {{ mongodb_shared_networks | default([]) | join(', ') }}"
      - "Coolify apps resolve it by name — no manual `docker network connect` needed."
      - "Set MONGODB_URI in Coolify — value is in {{ mongodb_backup_env }} on the VPS."
      - "DB '{{ mongodb_app_db }}', app user '{{ mongodb_app_user }}' (readWrite)."
