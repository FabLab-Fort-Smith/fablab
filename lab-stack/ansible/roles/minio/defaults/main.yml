---
# Self-hosted S3-compatible object storage (MinIO) on the VPS — replaces the external
# s3.crittercodes.dev instance (issue #96; partially reverses the "S3 external" half of ADR 0007).
# Root + a bucket-scoped app user come from ../.env at converge time (generated by `make secrets`),
# NOT from here — never put secrets in group_vars (@rules/workflow-secrets.md).
minio_manage: true

# Pin the image. MinIO is AGPL-3.0: we run it UNMODIFIED as a separate service and the app talks to
# it over the S3 API, so there is no source-disclosure obligation for our code
# (@rules/topic-license-compliance.md). Pin to a digest before this fronts production.
minio_image: "quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z"
minio_mc_image: "quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z"

minio_container_name: "fablab-minio"
minio_network: "fablab"                 # the private network this stack owns
# Networks MinIO ALSO joins so Coolify-deployed apps resolve it by name. Same reasoning as the
# mongodb role: attaching here (compose config) survives a restart/recreate, whereas a manual
# `docker network connect` does not — that is runtime state and staging lost its DB to it (#92).
minio_shared_networks:
  - "coolify"

minio_volume: "fablab_minio_data"
minio_dir: "/opt/fablab/minio"          # compose project dir on the VPS (root-only)

# NO published host ports by default: the app reaches MinIO over the docker network, exactly like
# MongoDB. Public exposure (s3.fablabfortsmith.org via Cloudflare + Traefik) is a SEPARATE, gated
# step in #96 — do not open ports here.
minio_publish_ports: false
minio_api_port: 9000
minio_console_port: 9001

# Bucket + access model, reconciled every converge.
minio_bucket: "fablab-bounties"
minio_region: "us-east-1"
minio_app_user: "fablab-app"
# Object versioning: a compromised app credential can otherwise permanently delete objects.
# Enabled from day one per #96.
minio_versioning: true
# Anonymous READ of OBJECTS is required: browsers load image URLs directly (the app builds public
# object URLs and its CSP allows the S3 host). We do NOT use mc's canned `download` alias — verified
# against a live MinIO, `download` also grants anonymous **s3:ListBucket**, so anyone could enumerate
# every object in the bucket. This explicit policy grants GetObject only: anonymous GET 200, while
# LIST / PUT / DELETE all return 403 (all four verified).
minio_anonymous_public_read: true
minio_anon_policy:
  Version: "2012-10-17"
  Statement:
    - Effect: Allow
      Principal:
        AWS:
          - "*"
      Action:
        - "s3:GetObject"
      Resource:
        - "arn:aws:s3:::{{ minio_bucket }}/*"
# Where the app-facing credentials/URI are written on the box (root-only), mirroring
# mongodb_backup_env, so the backup cron and operators have one place to look.
minio_env_file: "/etc/fablab/minio.env"

# The app's IAM policy, as data — ONE source of truth: the same structure is rendered to the JSON
# handed to `mc` AND compared against the live policy to decide "changed" (see tasks/main.yml).
# Scoped to this bucket only. Deliberately NO s3:DeleteBucket / s3:PutBucketPolicy / admin actions:
# a leaked app key must not be able to reconfigure or remove the bucket.
minio_app_policy:
  Version: "2012-10-17"
  Statement:
    - Effect: Allow
      Action:
        - "s3:GetObject"
        - "s3:PutObject"
        - "s3:DeleteObject"
        - "s3:AbortMultipartUpload"
        - "s3:ListMultipartUploadParts"
      Resource:
        - "arn:aws:s3:::{{ minio_bucket }}/*"
    - Effect: Allow
      Action:
        - "s3:ListBucket"
        - "s3:GetBucketLocation"
        - "s3:ListBucketMultipartUploads"
      Resource:
        - "arn:aws:s3:::{{ minio_bucket }}"
