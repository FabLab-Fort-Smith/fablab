[defaults]
inventory = inventory.ini
roles_path = roles
host_key_checking = True
retry_files_enabled = False
# YAML-formatted output via the built-in default callback. (The old `yaml` stdout_callback
# lived in community.general and was removed in v12 / ansible-core 2.13+; use result_format.)
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent

[privilege_escalation]
become = True
become_method = sudo
