# Copy to inventory.ini (git-ignored) and fill in the real host. The VPS is ordered manually
# (no Terraform provider for RackNerd — ADR 0004); this just points Ansible at it.
#
# Non-custodial admin (ADR 0008): a shared 'deploy' role account is created/managed by Ansible.
# FIRST converge: connect as an existing sudo user (critter/b007ab1e) to create it. AFTER that,
# switch ansible_user to 'deploy' (and CI/scheduled ops use the deploy account + its CI key).

[lab_vps]
# fablab-prod ansible_host=203.0.113.10

[lab_vps:vars]
ansible_user=b007ab1e            # first run; then switch to: ansible_user=deploy
# ansible_user=critter            # alternative existing sudo user for the first run
ansible_ssh_private_key_file=~/.ssh/fablab_deploy
ansible_port=22
ansible_become=true
