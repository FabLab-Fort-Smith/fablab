# Copy to inventory.ini (git-ignored) and fill in the real host. The VPS is ordered manually
# (no Terraform provider for RackNerd — ADR 0004); this just points Ansible at it.
#
# The box already has sudo users (critter, b007ab1e) with your SSH keys — connect as one of them;
# you do NOT need to create a 'deploy' user. Ansible uses sudo (become) for privileged tasks.

[lab_vps]
# fablab-prod ansible_host=203.0.113.10

[lab_vps:vars]
ansible_user=b007ab1e
# ansible_user=critter            # alternative existing sudo user
ansible_ssh_private_key_file=~/.ssh/fablab_deploy
ansible_port=22
ansible_become=true
