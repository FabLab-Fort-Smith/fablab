# Copy to inventory.ini (git-ignored) and fill in the real host. The VPS is ordered manually
# (no Terraform provider for RackNerd — ADR 0004); this just points Ansible at it.
#
# Non-custodial admin (ADR 0008): a shared 'deploy' role account is created/managed by Ansible.
# FIRST converge only: connect as an existing sudo user (critter/b007ab1e) to CREATE that account.
# Every converge AFTER that runs as 'deploy' — it is the account with passwordless sudo, so runs
# need no interactive password (CI/scheduled ops use the deploy account + its CI key).
#
# Two traps this cost us a broken converge over (#93):
#  1. A human sudo user (b007ab1e) needs a sudo PASSWORD, so unattended runs die with
#     "Missing sudo password". Use 'deploy', or pass -K for an interactive human run.
#  2. ansible_user set HERE OVERRIDES the `-u` CLI flag — inventory vars beat CLI defaults — so
#     `ansible-playbook -u deploy` does NOT override this line. Edit it, or use
#     `-e ansible_user=...` (an extra var, which does win).
#  3. If the key is passphrase-protected, load it into an agent first (`ssh-add`), or Ansible
#     cannot decrypt it and you get "Permission denied (publickey)".

[lab_vps]
# fablab-prod ansible_host=203.0.113.10

[lab_vps:vars]
# Steady state: converge as 'deploy' (passwordless sudo + docker group).
# First-converge bootstrap only: ansible_user=b007ab1e (or critter) to create the deploy account.
# Human break-glass without editing this file: -e ansible_user=b007ab1e -K
# NOTE: no inline comments on value lines — Ansible's INI parser folds them into the value.
ansible_user=deploy
ansible_ssh_private_key_file=~/.ssh/fablab_deploy
ansible_port=22
ansible_become=true
# Offer ONLY the key above (not every agent/default identity) — else sshd hits MaxAuthTries and
# drops the connection with "Too many authentication failures" before the right key is tried.
ansible_ssh_common_args=-o IdentitiesOnly=yes
