                message: { type: string }
      responses:
        '200': { description: Message sent. }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/contact-submissions:
    get:
      tags: [community]
      summary: List contact submissions (public)
      security: []
      responses:
        '200': { description: Submissions. }
    patch:
      tags: [community]
      summary: Update a contact submission status (public)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string }
                status: { type: string }
      responses:
        '200': { description: Updated. }

  /api/v1/discord/invite:
    get:
      tags: [community]
      summary: Generate a Discord invite and redirect (public)
      security: []
      responses:
        '302': { description: Redirect to the Discord invite URL. }
        '404': { description: No suitable channel found. }
        '500': { description: Failed to create invite. }

  /api/discord/interactions:
    post:
      tags: [community]
      summary: Discord interactions (slash commands) webhook
      description: >
        Verifies the Discord Ed25519 signature, then handles slash commands
        (check-in, profile, badges, wifi, award-stake, etc.). Returns Discord
        interaction response objects (type 1 ping ack, type 4 message).
      security: [{ discordSignature: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        '200': { description: Interaction response. }
        '401': { description: Missing or invalid signature. }
        '500': { description: Server configuration error. }

  /api/v1/upload:
    post:
      tags: [community]
      summary: Upload an image to S3 (session required)
      description: >
        Multipart upload. Validates by magic bytes (JPEG/PNG/GIF/WebP; SVG
        excluded), enforces a 5 MB limit, and stores under a server-generated key.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: Returns the public URL of the stored object. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: File too large (max 5 MB). }
        '415': { description: Unsupported file type. }
        '500': { description: Storage not configured or upload failed. }

  /api/image-proxy:
    get:
      tags: [community]
      summary: Proxy an allowlisted remote image (public; SSRF-guarded)
      description: >
        Fetches a client-supplied URL only if its host is on the allowlist and
        passes the SSRF guard; each redirect hop is re-validated. Caps size and time.
      security: []
      parameters:
        - { name: url, in: query, required: true, schema: { type: string, format: uri } }
      responses:
        '200': { description: The proxied image bytes. }
        '400': { description: Missing or disallowed URL. }
        '413': { description: Image too large. }
        '415': { description: Unsupported content type. }
        '502': { description: Upstream fetch failed or too many redirects. }

  # ──────────────────────────── access ──────────────────────────────────
  /api/v1/access/unlock:
    post:
      tags: [access]
      summary: Unlock the door for the current member (session required)
      description: >
        Authenticates the session, checks membership good-standing (active/probation,
        active subscription or waived, not community-only), then drives the door
        controller. Decisions are audit-logged.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Door unlocked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Access denied (not in good standing / community member). }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { description: Door controller failure. }

  /api/admin/pair-card:
    post:
      tags: [access, admin]
      summary: Start access-card pairing for a member (admin/staff only)
      description: Only admin or staff may pair cards (SEC-11). Calls the socket-server pairing endpoint.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
                deviceId: { type: string, default: access-scanner-01 }
      responses:
        '200': { description: Pairing started. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Unauthorized (not admin/staff). }
        '500': { description: Server configuration error. }

  # ──────────────────────────── internal (device tier) ──────────────────
  /api/internal/check-access:
    get:
      tags: [internal]
      summary: Card-access decision for the door controller (shared secret)
      description: >
        Device-tier endpoint. Authenticated by Bearer INTERNAL_API_SECRET
        (constant-time compare; fails closed if unset). Returns a grant decision
        for a scanned card.
      security: [{ bearerSecret: [] }]
      parameters:
        - { name: cardId, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Grant decision (granted true/false). }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { description: Server misconfiguration. }

  /api/internal/register-card:
    post:
      tags: [internal]
      summary: Register a scanned card to a user (shared secret)
      description: Device-tier endpoint. Authenticated by Bearer INTERNAL_API_SECRET. Stores the card code on the user's access key.
      security: [{ bearerSecret: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, cardId]
              properties:
                userId: { type: string }
                cardId: { type: string }
      responses:
        '200': { description: Card registered. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ──────────────────────────── admin ───────────────────────────────────
  /api/v1/admin/plans:
    get:
      tags: [admin]
      summary: List plans with subscriber counts (admin only)
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: subscribers, in: query, schema: { type: string }, description: Plan ID to list subscribers for instead. }
      responses:
        '200':
          description: Plans (or a subscriber list).
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Plan' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [admin]
      summary: Create a Square subscription plan (admin only)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, variations]
              properties:
                name: { type: string }
                variations:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      cadence: { type: string }
                      priceCents: { type: integer }
                      trialDays: { type: integer }
      responses:
        '201': { description: Plan created. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [admin]
      summary: Edit a plan / variations / metadata (admin only)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId: { type: string }
                name: { type: string }
                variations: { type: array, items: { type: object, additionalProperties: true } }
                newVariations: { type: array, items: { type: object, additionalProperties: true } }
                restore: { type: boolean }
                removeVariationId: { type: string }
                meta: { type: object, additionalProperties: true }
                markLegacy: { type: boolean }
                unmarkLegacy: { type: boolean }
      responses:
        '200': { description: Plan updated. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [admin]
      summary: Pause/resume/cancel/migrate a subscription (admin only)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, subscriptionId]
              properties:
                action: { type: string, enum: [pause, resume, cancel, migrate] }
                subscriptionId: { type: string }
                newPlanVariationId: { type: string, description: Required for migrate. }
      responses:
        '200': { description: Subscription action applied. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [admin]
      summary: Archive/delete a plan (admin only)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId: { type: string }
                cancelSubscriptions: { type: boolean }
      responses:
        '200': { description: Plan archived/deleted (or hidden if Square blocks deletion). }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/admin/coupons:
    get:
      tags: [admin]
      summary: List Square discounts/coupons (admin only)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Discounts. }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      summary: Create a discount/coupon (admin only)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, discountType]
              properties:
                name: { type: string }
                discountType: { type: string, enum: [FIXED_PERCENTAGE, FIXED_AMOUNT] }
                percentage: { type: string }
                amountCents: { type: integer }
                currency: { type: string, default: USD }
      responses:
        '201': { description: Discount created. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [admin]
      summary: Delete a discount/coupon (admin only)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties: { id: { type: string } }
      responses:
        '200': { description: Deleted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/delinquent:
    get:
      tags: [admin]
      summary: List delinquent (payment-failing) members (admin only)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Delinquent members with Square subscription detail. }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/duplicates:
    get:
      tags: [admin]
      summary: List duplicate-account groups (admin only)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Groups of users sharing an identity signal. }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/member-plans:
    get:
      tags: [admin]
      summary: List a member's Square subscriptions (admin only)
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: userID, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Enriched subscriptions for the member. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { description: Square fetch failed. }
    patch:
      tags: [admin]
      summary: Fix a PENDING subscription's start date (admin only)
      description: Cancels the pending subscription and recreates it with the corrected start date.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscriptionId, startDate]
              properties:
                subscriptionId: { type: string }
                startDate: { type: string, description: "YYYY-MM-DD" }
                userID: { type: string }
      responses:
        '200': { description: Subscription replaced. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { description: Square API error. }

  /api/v1/admin/square/sync:
    post:
      tags: [admin]
      summary: Sync all members' subscriptions from Square (admin only)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Counts of synced/granted/revoked plus per-user errors. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/admin/square/transactions:
    get:
      tags: [admin]
      summary: List recent Square payments with linked users (admin only)
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: beginTime, in: query, schema: { type: string, format: date-time } }
        - { name: endTime, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Enriched payments. }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [admin]
      summary: Link a Square customer to a member and sync/create subscription (admin only)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userID, squareCustomerId]
              properties:
                userID: { type: string }
                squareCustomerId: { type: string }
                grantAccess: { type: boolean }
                planVariationId: { type: string }
                startDate: { type: string }
      responses:
        '200': { description: Linked. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

