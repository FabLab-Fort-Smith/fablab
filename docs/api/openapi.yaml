      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The caller's notifications.
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [notifications]
      summary: Create a notification (admin only)
      description: App flows create notifications server-side; this HTTP entry is admin-only and can fan out to email/Discord.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Notification' } } }
      responses:
        '201': { description: Notification created. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [notifications]
      summary: Mark notification(s) read (session required)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [markRead, markAllRead] }
                notificationID: { type: string, description: Required for markRead. }
      responses:
        '200': { description: Updated. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

