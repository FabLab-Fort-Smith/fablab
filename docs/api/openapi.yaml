# OpenAPI 3.1 reference for The-Lab HTTP API.
#
# Status: current · Last reviewed: 2026-05-29 · Owners: app dev
# Audience: developers, reviewers integrating with or auditing the API.
#
# Accuracy note: methods and auth requirements are derived from the route
# handlers and their controllers/services under src/app/api/**. Auth is one of:
#   - public            no session required
#   - session required  the route calls auth() and rejects anonymous callers
#   - admin only         the route also requires session.user.role === "admin"
#   - shared secret      Bearer INTERNAL_API_SECRET (the IoT/device tier)
#   - signature          HMAC signature verification (Square / Discord webhooks)
#   - operational guard  guardOperationalEndpoint(): admin-only and blocked in production
#
# CTF/game endpoints (tag "ctf") and operational endpoints (tag "internal" /
# tag "operational") are documented briefly and flagged in their descriptions.
# "Hack the Lab" game content is intentionally vulnerable — see CLAUDE.md §14.
openapi: 3.1.0
info:
  title: The-Lab API
  version: "1.0"
  description: >
    HTTP API for The-Lab — the membership, community, and physical-access
    platform for Fab Lab Fort Smith. Most member-facing endpoints live under
    `/api/v1`. Authentication uses a next-auth v5 JWT session cookie; the single
    privileged role is `admin`. `/api/*` is NOT behind middleware, so each route
    authenticates and authorizes itself. See the API conventions doc (README.md)
    and the architecture overview for the layered route -> controller -> service
    -> model pattern.
servers:
  - url: /
    description: Same-origin (relative paths)

tags:
  - name: auth
    description: Registration, email verification, sign-in, next-auth handlers, and Discord account linking.
  - name: users
    description: Member records. Public reads return a safe projection; PII and credentials are never exposed to non-owners.
  - name: memberships
    description: Membership plans, checkout, subscription state, and access-key pairing.
  - name: payments
    description: Square-backed payments, donations, and sponsorship checkout.
  - name: square
    description: Square webhooks and subscription sync.
  - name: bounties
    description: Bounty board (tasks with stake/hours/cash rewards) and bounty ideas.
  - name: transactions
    description: Stake economy — listing, awarding, and tipping stake.
  - name: notifications
    description: Per-user private notifications.
  - name: badges
    description: Badge catalog and definitions.
  - name: portfolio
    description: Member project showcase.
  - name: community
    description: Announcements, activity feed, repairs, bug reports, contact, check-in, leaderboard, analytics.
  - name: access
    description: Physical door access and access-card pairing (IoT tier).
  - name: admin
    description: Admin-only management endpoints (plans, coupons, delinquency, duplicates, Square ops).
  - name: internal
    description: Device-tier endpoints authenticated by a shared Bearer secret (INTERNAL_API_SECRET).
  - name: operational
    description: Seed/migration/test endpoints — admin-only and blocked in production (SEC-18).
  - name: ctf
    description: Hack the Lab capture-the-flag game. Intentionally vulnerable game content; do not treat as real defects.

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: authjs.session-token
      description: next-auth v5 JWT session cookie. Resolved server-side via auth().
    bearerSecret:
      type: http
      scheme: bearer
      description: Shared device-tier secret (INTERNAL_API_SECRET), compared in constant time.
    squareSignature:
      type: apiKey
      in: header
      name: x-square-hmacsha256-signature
      description: Square webhook HMAC-SHA256 signature, verified against the notification URL + body.
    discordSignature:
      type: apiKey
      in: header
      name: x-signature-ed25519
      description: Discord interaction Ed25519 signature (with x-signature-timestamp).

  schemas:
    Error:
      type: object
      description: Standard error envelope. Client-facing messages are generic; no stack traces or internal hostnames.
      properties:
        error:
          type: string
          example: Unauthorized
      required: [error]

    User:
      type: object
      description: >
        Member record in its public-safe projection (see
        src/app/api/v1/users/access.js). PII (email, phoneNumber), credentials
        (password), and integration IDs (discordId, googleId, squareID) are
        excluded for anonymous/non-owner readers. The owner and admins receive
        additional fields (decrypted email/phone), but never the password hash.
      properties:
        _id: { type: string }
        userID: { type: string, example: usr_a1b2c3 }
        username: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        image: { type: string, format: uri }
        bio: { type: string }
        role: { type: string, enum: [member, staff, admin], example: member }
        boardPosition: { type: string, nullable: true }
        isPublic: { type: boolean }
        socials: { type: object, additionalProperties: true }
        interests: { type: array, items: { type: string } }
        hobbies: { type: array, items: { type: string } }
        creatorType: { type: string }
        skills: { type: array, items: { type: string } }
        badges: { type: array, items: { type: string } }
        capturedFlags: { type: array, items: { type: string } }
        stake: { type: number }
        stakeHistory: { type: array, items: { type: object, additionalProperties: true } }
        membership:
          type: object
          description: Public-safe membership sub-fields only.
          properties:
            status: { type: string, enum: [active, probation, suspended, banned, founder], example: active }
            type: { type: string, enum: [community, co-op], example: co-op }
            isWaived: { type: boolean }
            subscriptionStatus: { type: string, example: ACTIVE }

    Bounty:
      type: object
      properties:
        bountyID: { type: string }
        title: { type: string }
        description: { type: string }
        creatorID: { type: string, description: Forced to the authenticated user on create. }
        status: { type: string, enum: [open, assigned, submitted, verified, completed, cancelled], example: open }
        rewardType: { type: string, enum: [hours, cash, custom] }
        rewardValue: { type: string }
        stakeValue: { type: number }
        isInfinite: { type: boolean }
        recurrence: { type: string, enum: [none, weekly, monthly], example: none }
        requirements: { type: array, items: { type: string } }
        badgeRewardID: { type: string, nullable: true }
        likes: { type: array, items: { type: string } }
        comments: { type: array, items: { type: object, additionalProperties: true } }
        createdAt: { type: string, format: date-time }

    Notification:
      type: object
      description: Per-user private notification. Owner is always derived from the session (SEC-14).
      properties:
        _id: { type: string }
        userID: { type: string }
        type: { type: string, example: success }
        title: { type: string }
        message: { type: string }
        link: { type: string }
        read: { type: boolean }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }

    Plan:
      type: object
      description: Membership plan derived from the Square catalog (SUBSCRIPTION_PLAN).
      properties:
        id: { type: string }
        name: { type: string }
        price: { type: number, description: Dollars (admin list uses priceCents on variations). }
        currency: { type: string, example: USD }
        hidden: { type: boolean }
        legacy: { type: boolean }
        subscriberCount: { type: integer }
        description: { type: string }
        benefits: { type: array, items: { type: string } }
        variations:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              variationId: { type: string }
              name: { type: string }
              cadence: { type: string, example: MONTHLY }
              priceCents: { type: integer, nullable: true }
              trialDays: { type: integer }

    Transaction:
      type: object
      description: Stake-economy or donation transaction.
      properties:
        transactionId: { type: string }
        type: { type: string, enum: [award, tip, donation], example: tip }
        amount: { type: number, description: Stake amount, or cents for donations. }
        currency: { type: string, example: USD }
        status: { type: string, example: pending }
        userID: { type: string, nullable: true }
        senderId: { type: string, nullable: true }
        receiverId: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }

  responses:
    Unauthorized:
      description: Not authenticated (no/invalid session, or missing/invalid shared secret).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but not permitted (e.g. non-admin, not the owner).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Missing or invalid parameters.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

paths:

  # ──────────────────────────────── auth ────────────────────────────────
  /api/auth/{nextauth}:
    parameters:
      - name: nextauth
        in: path
        required: true
        schema: { type: string }
        description: next-auth catch-all (callback, signin, signout, session, csrf, providers).
    get:
      tags: [auth]
      summary: next-auth handler (GET)
      description: Delegates to next-auth handlers (auth.js). Session, CSRF, providers, OAuth callbacks.
      security: []
      responses: { '200': { description: Handler response (varies by sub-route). } }
    post:
      tags: [auth]
      summary: next-auth handler (POST)
      description: Delegates to next-auth handlers (sign-in, sign-out, callbacks).
      security: []
      responses: { '200': { description: Handler response (varies by sub-route). } }

  /api/auth/register:
    post:
      tags: [auth]
      summary: Register a new member (public)
      description: Public sign-up. Verifies a Google reCAPTCHA token (RECAPTCHA_SECRET_KEY required; fails closed). The plaintext password is never logged.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, captchaToken]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                firstName: { type: string }
                lastName: { type: string }
                captchaToken: { type: string }
      responses:
        '201': { description: User registered. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: A user with this email already exists. }
        '500': { description: Captcha unavailable or registration failure. }

  /api/auth/signin:
    post:
      tags: [auth]
      summary: Verify credentials for next-auth (public)
      description: Used by the Credentials provider. Returns the user payload for next-auth to issue a session, or 401 on bad credentials.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, description: Email or username. }
                password: { type: string, format: password }
      responses:
        '200': { description: Credentials valid. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/verify-email:
    get:
      tags: [auth]
      summary: Verify email via token (public)
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Email verified. }
        '400': { description: Missing or invalid token. }

  /api/auth/resend-verification:
    post:
      tags: [auth]
      summary: Resend the verification email (public)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        '200': { description: Verification email sent. }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/auth/link-intent:
    post:
      tags: [auth]
      summary: Mark the next OAuth flow as a Discord link (session required)
      description: Sets a short-lived HttpOnly cookie so the OAuth callback links Discord to the existing user instead of creating a new account.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Intent cookie set. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/discord/link:
    get:
      tags: [auth]
      summary: Start Discord account-link OAuth (session required)
      description: Redirects to Discord OAuth with a signed state JWT carrying the userID. Anonymous callers are redirected to sign-in.
      security: [{ sessionCookie: [] }]
      responses:
        '302': { description: Redirect to Discord authorize endpoint (or to sign-in if unauthenticated). }

  /api/v1/auth/discord/callback:
    get:
      tags: [auth]
      summary: Discord account-link OAuth callback (public; state-JWT verified)
      description: Verifies the signed state JWT, exchanges the code, and writes discordId/discordHandle to the target user. Always redirects to the dashboard.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '302': { description: Redirect back to the dashboard with a status query param. }

  # ──────────────────────────────── users ───────────────────────────────
  /api/v1/users:
    get:
      tags: [users]
      summary: List users or look up by query
      description: >
        With a query param (email/username/userID/phoneNumber/firstName/lastName)
        looks up a single user; otherwise lists users. Anonymous/non-admin callers
        receive only opted-in active members in a public-safe projection; admins
        get the full directory and all filters.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: email, in: query, schema: { type: string } }
        - { name: username, in: query, schema: { type: string } }
        - { name: userID, in: query, schema: { type: string } }
        - { name: phoneNumber, in: query, schema: { type: string } }
        - { name: firstName, in: query, schema: { type: string } }
        - { name: lastName, in: query, schema: { type: string } }
        - { name: isPublic, in: query, schema: { type: boolean } }
        - { name: role, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: memberType, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 12 } }
      responses:
        '200':
          description: A user, or a paged list.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties: { user: { $ref: '#/components/schemas/User' } }
                  - type: object
                    properties:
                      users: { type: array, items: { $ref: '#/components/schemas/User' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [users]
      summary: Create a user (admin only)
      description: Public sign-up goes through /api/auth/register; this endpoint is admin-only.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '201': { description: User created. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [users]
      summary: Update a user (session required; non-admins own record only)
      description: >
        Non-admins may only update their own record (ownership is forced to the
        session user) and only whitelisted self-writable fields; role/status/stake
        and other privileged fields are dropped. Admins may target any user.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: query, in: query, schema: { type: string }, description: Identifier (admins only — ignored for non-admins). }
        - { name: userID, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: User updated. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [users]
      summary: Delete a user (admin only)
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: userID, in: query, schema: { type: string } }
        - { name: query, in: query, schema: { type: string } }
      responses:
        '200': { description: User deleted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/users/change-password:
    post:
      tags: [users]
      summary: Change own password (session required)
      description: Verifies the current password before updating. Returns 401 if the current password is wrong.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password }
      responses:
        '200': { description: Password updated. }
        '401': { description: Unauthenticated or incorrect current password. }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/users/verify-credentials:
    post:
      tags: [users]
      summary: Verify a member's credentials (session required)
      description: Confirms ownership of an account (used by the self-merge flow). Returns a safe user object on success.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200': { description: Credentials verified. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/users/merge:
    post:
      tags: [users]
      summary: Merge two user accounts (session required; ownership-checked)
      description: >
        Admins may merge any pair. A non-admin may only merge a source account
        INTO their own and must prove ownership of the source via its credentials.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetUserID, sourceUserID]
              properties:
                targetUserID: { type: string }
                sourceUserID: { type: string }
                overrides: { type: object, additionalProperties: true }
                sourceEmail: { type: string }
                sourcePassword: { type: string, format: password }
      responses:
        '200': { description: Accounts merged. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/users/nudge:
    post:
      tags: [users]
      summary: Nudge (remind) a user (admin only)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userID]
              properties:
                userID: { type: string }
                preview: { type: boolean }
      responses:
        '200': { description: Nudge sent (or preview returned). }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/users/decline-email:
    post:
      tags: [users]
      summary: Send an application-declined email (admin only)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userID]
              properties: { userID: { type: string } }
      responses:
        '200': { description: Decline email sent. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────── memberships ──────────────────────────────
  /api/v1/memberships:
    get:
      tags: [memberships]
      summary: List membership plans from Square (public)
      security: []
      responses:
        '200': { description: Plans with variations and pricing. }
        '404': { description: No membership plans found. }
    put:
      tags: [memberships]
      summary: Add/remove the locker add-on
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userID, action]
              properties:
                userID: { type: string }
                action: { type: string, enum: [add, remove] }
      responses:
        '200': { description: Locker updated. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [memberships]
      summary: Cancel a membership (Square subscription)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userID]
              properties: { userID: { type: string } }
      responses:
        '200': { description: Membership cancelled. }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/memberships/{planID}/checkout:
    post:
      tags: [memberships]
      summary: Create a Square checkout link for a plan
      description: Builds a Square payment link for the given plan variation, optionally applying a coupon discount. The buyer email is taken from the session.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: planID, in: path, required: true, schema: { type: string }, description: Square plan variation ID. }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userID, price]
              properties:
                userID: { type: string }
                price: { type: number }
                currency: { type: string, default: USD }
                couponCode: { type: string }
      responses:
        '200': { description: Checkout URL returned. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/memberships/confirm:
    get:
      tags: [memberships]
      summary: Confirm a Square checkout and activate access (redirect target)
      description: >
        Square redirects here after checkout. Verifies the payment / resolves the
        subscription, activates the member, and redirects to the dashboard. Always
        responds with a redirect.
      security: []
      parameters:
        - { name: userID, in: query, required: true, schema: { type: string } }
        - { name: planVariationId, in: query, schema: { type: string } }
        - { name: transactionId, in: query, schema: { type: string } }
        - { name: checkoutId, in: query, schema: { type: string } }
      responses:
        '302': { description: Redirect to the dashboard with success/error/pending status. }

  /api/v1/memberships/subscription:
    get:
      tags: [memberships]
      summary: Get live subscription details (session required; owner or admin)
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: userID, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Subscription details (or null if none). }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [memberships]
      summary: Sync subscription from Square by customer (session required; owner or admin)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userID]
              properties: { userID: { type: string } }
      responses:
        '200': { description: Subscription synced. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [memberships]
      summary: Cancel/pause/resume own subscription (session required; owner or admin)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userID, action]
              properties:
                userID: { type: string }
                action: { type: string, enum: [cancel, pause, resume] }
      responses:
        '200': { description: Action applied. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/memberships/pair-key:
    post:
      tags: [memberships, access]
      summary: Start access-card pairing for a member (session required; owner or admin)
      description: >
        Triggers pairing mode on the door panel via the socket-server. Requires an
        approved access key (membership.accessKey.issued). Clears the old card code
        first so the previous card stops working immediately.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userID]
              properties: { userID: { type: string } }
      responses:
        '200': { description: Pairing mode started. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Forbidden, or access key not yet approved. }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { description: Could not reach the door panel. }

  /api/v1/square/subscriptions:
    post:
      tags: [square]
      summary: Square subscription webhook (legacy handler)
      description: Receives a Square webhook payload and processes it via the subscription service.
      security: [{ squareSignature: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        '200': { description: Processed. }
        '500': { description: Processing error. }

  /api/v1/square/subscriptions/sync:
    post:
      tags: [square]
      summary: Sync a single subscription by Square ID
      description: Server-side/admin utility — syncs a user's subscription from Square given a squareID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [squareID]
              properties:
                squareID: { type: string }
                userID: { type: string }
      responses:
        '200': { description: Subscription synced. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/square/webhooks/payment:
    post:
      tags: [square]
      summary: Square payment/subscription webhook
      description: >
        Primary Square webhook. Verifies the HMAC signature (constant time, fails
        closed) and is idempotent (claims the event_id before applying effects).
        Drives membership activation/renewal, grace periods, sponsorship, and
        revocation. Returns 200 on duplicate events without re-running side effects.
      security: [{ squareSignature: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        '200': { description: Acknowledged (processed or deduped). }
        '401': { description: Invalid signature. }
        '500': { description: Processing failed (idempotency claim released for retry). }

  # ─────────────────────────── payments ─────────────────────────────────
  /api/v1/payments:
    post:
      tags: [payments]
      summary: Create a one-off Square payment
      description: Charges a Square payment source token. Square handles card data; PAN/CVV are never stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, sourceId]
              properties:
                amount: { type: integer, description: Amount in cents. }
                sourceId: { type: string, description: Square payment source token. }
                customerId: { type: string }
                currency: { type: string, default: USD }
      responses:
        '200': { description: Square payment result. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { description: Payment error. }

  /api/v1/donations:
    get:
      tags: [payments]
      summary: List donations (session required; own unless admin)
      description: Non-admins see only their own donations; admins may filter by userID.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: userID, in: query, schema: { type: string }, description: Admin filter only. }
      responses:
        '200': { description: Donation transactions. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/donations/checkout:
    post:
      tags: [payments]
      summary: Create a donation checkout link (public)
      description: Creates a pending donation transaction and a Square payment link. Supports one-time and monthly donations.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, description: Amount in USD. }
                frequency: { type: string, enum: [one-time, monthly] }
                redirectUrl: { type: string }
                donorInfo: { type: object, properties: { name: { type: string }, email: { type: string } } }
                userId: { type: string }
      responses:
        '200': { description: Checkout URL returned. }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/donations/stats:
    get:
      tags: [payments]
      summary: Monthly donation vs. expense stats (public)
      security: []
      responses:
        '200': { description: Donation total, member-expense breakdown, goal, and net. }

  /api/v1/sponsorship/checkout:
    post:
      tags: [payments]
      summary: Create a sponsorship (gift membership) checkout link (public)
      description: Builds a Square link to sponsor another member's membership, one-time or recurring. The recipient is encoded in the payment note for the webhook.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipientId]
              properties:
                recipientId: { type: string }
                donorId: { type: string }
                type: { type: string, enum: [one-time, subscription], default: one-time }
      responses:
        '200': { description: Checkout URL returned. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────── bounties ─────────────────────────────────
  /api/v1/bounties:
    get:
      tags: [bounties]
      summary: List bounties or fetch one (public)
      security: []
      parameters:
        - { name: bountyID, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: creatorID, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
      responses:
        '200':
          description: A bounty or a paged list.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties: { bounty: { $ref: '#/components/schemas/Bounty' } }
                  - type: object
                    additionalProperties: true
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [bounties]
      summary: Create a bounty (session required)
      description: creatorID is forced to the authenticated user.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Bounty' }
      responses:
        '201': { description: Bounty created. }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [bounties]
      summary: Act on a bounty (session required)
      description: >
        action selects the operation. Ownership/role checks are enforced in the
        service for actions that mutate state.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: bountyID, in: query, required: true, schema: { type: string } }
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [assign, submit, verify, cancel, edit, clawback, like, comment, share]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                submission: { type: string }
                claimUserID: { type: string }
                updateData: { type: object, additionalProperties: true }
                text: { type: string }
                recipientID: { type: string }
      responses:
        '200': { description: Action applied. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [bounties]
      summary: Delete a bounty (session required; ownership-checked)
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: bountyID, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Bounty deleted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/bounties/seed:
    post:
      tags: [operational]
      summary: Seed starter bounties (admin only; blocked in production)
      description: Operational seed endpoint guarded by guardOperationalEndpoint() (SEC-18).
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Seeding complete. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Forbidden, or disabled in production. }

  /api/v1/bounty-ideas:
    get:
